[package]
name = "kletse-rss"
version = "1.1.0"
edition = "2021"
description = "A one-article-at-a-time Miniflux reader for Omarchy"

[lib]
name = "kletse_rss_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
notify = "8"
dirs = "6"

[profile.release]
lto = true
strip = true
