[package]
name = "kletse-rss"
version = "3.2.0"
edition = "2021"
description = "A one-article-at-a-time Miniflux reader for Omarchy and macOS"
license = "MIT"
repository = "https://github.com/kletse/kletse-rss-reader"
authors = ["Ward Werbrouck <ward@kletse.be>"]
publish = false

[lib]
name = "kletse_rss_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "1"
dirs = "7"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-window-state = "2" # remembers window size and position, as Mac apps do

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = "8" # follows the Omarchy theme directory

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Backport of the glib VariantStrIter soundness fix; see patches/glib-0.18.5/PATCHED.md.
[patch.crates-io]
glib = { path = "patches/glib-0.18.5" }
