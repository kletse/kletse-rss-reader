[package]
name = "kletse-rss"
version = "4.0.1"
edition = "2024"
rust-version = "1.88" # let chains
description = "A one-article-at-a-time Miniflux reader for Omarchy and macOS"
license = "MIT"
repository = "https://github.com/kletse/kletse-rss-reader"
authors = ["Ward Werbrouck <ward@kletse.be>"]
publish = false

[dependencies]
# The window: Qt Quick, driven from Rust.
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
# Servers and the config file.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3" # the config is saved through a temporary file
toml = "1"
dirs = "7"
# Articles: feed HTML to native blocks, code highlighted.
scraper = "0.29"
ego-tree = "0.11" # the node type scraper hands out
url = "2"
base64 = "0.22"
percent-encoding = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = "8" # follows the Omarchy theme directory

[build-dependencies]
cxx-qt-build = "0.10"

[dev-dependencies]
wiremock = "0.6"

[lints.rust]
# cxx-qt's bridge is generated FFI; `bridge.rs` allows it there and nowhere else.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

# syntect and html5ever are slow unoptimized; keeps debug builds pleasant to read in.
[profile.dev.package."*"]
opt-level = 2
