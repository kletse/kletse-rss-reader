[package]
name = "kletse-rss"
version = "1.1.0"
edition = "2021"
description = "A one-article-at-a-time Miniflux reader for Omarchy"
license = "MIT"
repository = "https://github.com/kletse/kletse-rss-reader"
authors = ["Ward Werbrouck <ward@kletse.be>"]
publish = false

[lib]
name = "kletse_rss_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "1"
notify = "8"
dirs = "7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
