name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: fmt, clippy, tests and a QML smoke test
    runs-on: ubuntu-latest
    # Arch, as the app's users run it: a current Qt 6 and Rust from the distribution.
    container: archlinux:latest
    steps:
      - name: Install Rust, Qt 6 and a font
        run: pacman -Syu --noconfirm --needed base-devel git rust qt6-base qt6-declarative qt6-svg qt6-imageformats ttf-dejavu
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Same version in every file that carries it
        run: packaging/check-version.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The terminal version, without Qt: the binary people install.
      - run: cargo clippy --all-targets --no-default-features --features tui --locked -- -D warnings
      - run: cargo test --no-default-features --features tui --locked
      # QML is only checked when it runs. Render a few screens of the demo offscreen; any QML warning (a type that
      # doesn't resolve, a binding loop, a missing property) is fatal and fails the job.
      - name: Smoke test the window
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FATAL_WARNINGS: "1"
          QT_FORCE_STDERR_LOGGING: "1"
          LANG: C.UTF-8
          ONWARD_DEMO: "1"
        run: |
          cargo build --locked
          for keys in "Enter" "Enter n n" "Enter ?" "Enter ," "h Enter" "Enter A" "Enter n n n n n n n n" \
              "Enter /" "Enter v" "Enter n p A" "j j j Enter j" "Enter *" "j Enter" "Enter , find" \
              "Enter , find Escape" "i" "e" "m" "a"; do
            echo "== $keys"
            rm -f /tmp/shot.png
            ONWARD_SNAPSHOT=/tmp/shot.png ONWARD_SNAPSHOT_KEYS="$keys" timeout 60 target/debug/onward
            test -s /tmp/shot.png
          done
      # The demo skips first run, so the runs above never reach its QML. With no config and no demo, the window opens
      # on the first screen, and these keys walk each of its screens; any QML warning is fatal here as well.
      - name: Smoke test first run
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FATAL_WARNINGS: "1"
          QT_FORCE_STDERR_LOGGING: "1"
          LANG: C.UTF-8
        run: |
          empty=$(mktemp -d)
          mkdir "$empty/config" "$empty/state"
          export XDG_CONFIG_HOME="$empty/config" XDG_STATE_HOME="$empty/state"
          for keys in " " "ArrowDown ArrowDown" "ArrowDown Enter" "ArrowDown Enter Escape" "ArrowUp Enter" \
              "ArrowUp Enter ArrowDown Enter" "Enter" "Enter Enter" "Enter Enter ," "Enter Enter , Escape"; do
            echo "== $keys"
            rm -f /tmp/shot.png
            ONWARD_SNAPSHOT=/tmp/shot.png ONWARD_SNAPSHOT_KEYS="$keys" timeout 60 target/debug/onward
            test -s /tmp/shot.png
          done
          # Connect's stages, against a fake server that answers as real ones do. Nothing here signs in anywhere.
          python3 .github/fake-server.py &
          fake=$!
          trap 'kill $fake' EXIT
          sleep 1
          look="ArrowDown Enter type:127.0.0.1:18399"
          for keys in "ArrowDown Enter row:0" "ArrowDown Enter row:0 Escape" "ArrowDown Enter type:rss accept" \
              "$look/miniflux accept x x" "$look/miniflux accept x x Escape" "$look/miniflux accept x x row:0" \
              "$look/miniflux accept x x row:0 row:1" \
              "$look/miniflux accept x x type:someone tab type:wrong accept x x" \
              "$look/old accept x x type:someone tab type:wrong accept x x" "$look/no-passwords accept x x" \
              "$look/freshrss accept x x" "$look/freshrss-off accept x x" "$look/freshrss-stripped accept x x" \
              "$look/commafeed accept x x" "$look/gate accept x x" "$look/nothing accept x x"; do
            echo "== $keys"
            rm -f /tmp/shot.png
            ONWARD_SNAPSHOT=/tmp/shot.png ONWARD_SNAPSHOT_KEYS="$keys" timeout 60 target/debug/onward
            test -s /tmp/shot.png
          done
          # An empty account, on each kind of server, and the way from it through importing and exporting. Each config
          # says who's there, and these never leave this machine either.
          good=/tmp/onward-feeds.opml
          printf '<opml version="2.0"><body><outline text="A" xmlUrl="https://a.example/feed"/></body></opml>' > "$good"
          echo '<rss version="2.0"></rss>' > /tmp/onward-not-opml.xml
          mkdir "$empty/config/onward"
          walk() {
            for keys in "$@"; do
              echo "== $(head -c 60 "$empty/config/onward/config.toml" | tr '\n' ' '): $keys"
              rm -f /tmp/shot.png
              ONWARD_SNAPSHOT=/tmp/shot.png ONWARD_SNAPSHOT_KEYS="$keys" timeout 60 target/debug/onward
              test -s /tmp/shot.png
            done
          }
          cat > "$empty/config/onward/config.toml" <<EOF
          [miniflux]
          url = "http://127.0.0.1:18399/empty-miniflux"
          api_key = "key"
          EOF
          walk x i "i Enter" "i file:$good x x" "i file:$good x x Enter" "i file:/nothing/here.opml x" \
              "i file:/tmp/onward-not-opml.xml x" e "e file:/tmp/onward-out.opml x x" "e file:$good x x" \
              "e file:$good x x n" "e file:$good x x y x x"
          cat > "$empty/config/onward/config.toml" <<EOF
          server = "greader"
          [greader]
          url = "http://127.0.0.1:18399/empty-freshrss/api/greader.php"
          username = "me"
          password = "password"
          EOF
          walk x i "i file:$good x x" "i file:$good Escape x x" e
          cat > "$empty/config/onward/config.toml" <<EOF
          server = "greader"
          [greader]
          url = "http://127.0.0.1:18399/integration"
          username = "me"
          password = "password"
          EOF
          # What can't change here is left out, and m and a say why.
          walk x i e "e file:/tmp/onward-out-2.opml x x" m a
          # Changing feeds, on accounts that hold them. Each run starts from the same feeds, as an address is not an
          # account: POST /reset puts them back.
          manage() {
            for keys in "$@"; do
              curl -fsS -X POST http://127.0.0.1:18399/reset > /dev/null
              walk "$keys"
            done
          }
          add="a type:http://feeds.example"
          cat > "$empty/config/onward/config.toml" <<EOF
          [miniflux]
          url = "http://127.0.0.1:18399/feeds-miniflux"
          api_key = "key"
          EOF
          manage x m "m j j" "m Escape" "m ?" a "a accept x" "$add/new.xml accept x x" "$add/alpha.xml accept x x" \
              "$add/page.html accept x x" "a type:notaurl accept x x" "$add.invalid/x.xml accept x x" \
              "m j j a type:http://feeds.example/new.xml accept x x" "m j j r" "m j j r type:Renamed accept x x" \
              "m j r type:Latest accept x x" "m j j m" "m j j m Enter x x" "m j j m ArrowUp Enter" \
              "m j j m ArrowUp Enter type:Later accept x x" "m j j d" "m j j d Enter" "m j j d n" "m j j d y x x" \
              "m j d x x" "m j d x n" "m j d x y x x" "m d x x" "m d x Enter x x" "m f" "m j j f Escape x"
          cat > "$empty/config/onward/config.toml" <<EOF
          server = "greader"
          [greader]
          url = "http://127.0.0.1:18399/feeds-freshrss/api/greader.php"
          username = "me"
          password = "password"
          EOF
          manage x m "$add/new.xml accept x x" "$add/alpha.xml accept x x" "$add/page.html accept x x" \
              "a type:notaurl accept x x" "$add.invalid/x.xml accept x x" "m j j r type:Renamed accept x x" \
              "m j r type:Latest accept x x" "m j j m Enter x x" "m j j m ArrowUp Enter type:Later accept x x" \
              "m j r type:Tech accept x" "m j d x x" "m j d x Enter x x" "m j j d y x x" \
              "m j j j j j j j r" "m j j j j j j j d"
          # An account with nothing on it, where it starts from a feed's address.
          cat > "$empty/config/onward/config.toml" <<EOF
          [miniflux]
          url = "http://127.0.0.1:18399/empty-miniflux"
          api_key = "key"
          EOF
          walk m a
          # There's no D-Bus here, so a save has no keyring: the secret goes to the file, once, and out of config.toml.
          curl -fsS -X POST http://127.0.0.1:18399/reset > /dev/null
          secrets="$empty/state/onward/secrets.toml"
          grep -q 'api_key = "key"' "$empty/config/onward/config.toml"
          walk ", accept x x" ", accept x x"
          if grep -qE 'api_key|"key"' "$empty/config/onward/config.toml"; then exit 1; fi
          grep -q 'value = "key"' "$secrets"
          test "$(stat -c %a "$secrets")" = 600
          grep -q 'told_file = true' "$empty/state/onward/prefs.toml"
          # And from there on it's found without a word, after a restart.
          walk x m
          # With neither, the app says so, and it's the picker that does, not first run.
          mv "$secrets" "$secrets.kept"
          walk x ", x"
          mv "$secrets.kept" "$secrets"
          rm "$empty/config/onward/config.toml" "$secrets"
          rmdir "$empty/config/onward"
          # Readeck in a browser: approved, which is saved by itself, and out of config.toml; turned down; an address on
          # another host, shown and not opened; and a server that doesn't offer it, which leaves the token field.
          mkdir "$empty/config/onward"
          plain_config() {
            cat > "$empty/config/onward/config.toml" <<EOF
          [miniflux]
          url = "http://127.0.0.1:18399/empty-miniflux"
          api_key = "key"
          EOF
          }
          grant="tab type:http://127.0.0.1:18399/readeck"
          plain_config
          curl -fsS -X POST http://127.0.0.1:18399/reset > /dev/null
          walk ", $grant-approve grant:0 x x x x x x x x"
          grep -q 'url = "http://127.0.0.1:18399/readeck-approve"' "$empty/config/onward/config.toml"
          if grep -q 'the-readeck-token' "$empty/config/onward/config.toml"; then exit 1; fi
          grep -q 'value = "the-readeck-token"' "$secrets"
          rm "$secrets"
          for offer in deny elsewhere none; do
            plain_config
            walk ", $grant-$offer grant:0 x x x x x x"
            if grep -q 'readeck' "$empty/config/onward/config.toml"; then exit 1; fi
            rm -f "$secrets"
          done
          rm "$empty/config/onward/config.toml"
          rmdir "$empty/config/onward"
          # A broken config file still says so.
          mkdir "$empty/config/onward"
          echo "server = miniflux" > "$empty/config/onward/config.toml"
          for keys in " " "ArrowDown Enter"; do
            echo "== broken config: $keys"
            rm -f /tmp/shot.png
            ONWARD_SNAPSHOT=/tmp/shot.png ONWARD_SNAPSHOT_KEYS="$keys" timeout 60 target/debug/onward
            test -s /tmp/shot.png
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-shot
          path: /tmp/shot.png
          if-no-files-found: ignore

  macos:
    name: macOS clippy, tests and the native app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        run: brew install qt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The library the native app links: its C interface and the macOS-only code, without Qt.
      - run: cargo clippy --all-targets --no-default-features --features ffi --locked -- -D warnings
      - run: cargo test --no-default-features --features ffi --locked
      # The terminal version, which is all a Mac needs Rust for if it never builds the app.
      - run: cargo clippy --all-targets --no-default-features --features tui --locked -- -D warnings
      - run: cargo test --no-default-features --features tui --locked
      - run: packaging/macos/build-app.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # rustsec/audit-check posts its result as a check run
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
